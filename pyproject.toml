[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "myoutbrain"
version = "0.1.0"
description = "A local-first personal cognitive library."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3"]

[project.scripts]
myoutbrain = "myoutbrain.cli:main"
myoutbrain-dialogue-prototype = "myoutbrain.dialogue_learning_prototype:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myoutbrain = ["schemas/*.json"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
